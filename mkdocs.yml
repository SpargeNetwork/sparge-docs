site_name: Sparge Chain
site_description: Public alpha documentation for Sparge Chain

exclude_docs: |
  internal/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Why Sparge: why-sparge.md
  - Wallet: wallet.md
  - Build on Sparge: builder-guide.md
  - RPC API: rpc.md
  - Protocol: protocol.md
  - Observer Node: observer.md
  - Security: security.md
  - FAQ: faq.md
  - Reference:
      - Configuration: reference/configuration.md

extra_css:
  - stylesheets/extra.css
