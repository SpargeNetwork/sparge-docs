site_name: Sparge Chain
site_description: Public alpha documentation for Sparge Chain
docs_dir: docs

exclude_docs: |
  internal/

theme:
  name: material

  logo: assets/sparge-logo.png
  favicon: assets/sparge-logo.png

  palette:
    scheme: slate
    primary: custom
    accent: custom

  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Start Using Sparge: getting-started.md
  - Wallet: wallet.md
  - Participation & Rewards: protocol.md
  - Run an Observer: observer.md
  - Build on Sparge:
      - Builder Guide: developer-guide.md
      - Public API: rpc.md
  - Security: security.md
  - FAQ: faq.md

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
