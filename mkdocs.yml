site_name: Sparge Chain
site_description: Public alpha documentation for Sparge Chain

exclude_docs: |
  internal/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Wallet: wallet.md
  - Observer Node: observer.md
  - Protocol: protocol.md
  - Developer Guide: developer-guide.md
  - RPC API: rpc.md
  - Operator Guide: operator-guide.md
  - Security: security.md
  - FAQ: faq.md
  - Reference:
      - Configuration: reference/configuration.md

extra_css:
  - stylesheets/extra.css
